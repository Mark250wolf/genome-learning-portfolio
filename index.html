
<!-- BEGIN LABORATORY PROCEDURE LIBRARY -->
<style>
#lab-procedures {
  display: none;
  min-height: 100vh;
  background: #020617;
  color: #e2e8f0;
  padding: 25px 18px 70px;
  font-family: Arial, sans-serif;
}
#lab-procedures * { box-sizing: border-box; }
.lab-wrap { max-width: 1050px; margin: auto; }
.lab-heading { color: #67e8f9; }
.lab-muted { color: #94a3b8; }
.lab-card {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 18px;
  margin: 14px 0;
}
.lab-folder {
  display: block;
  width: 100%;
  text-align: left;
  background: #0f172a;
  color: #e2e8f0;
  border: 1px solid #334155;
  border-radius: 9px;
  margin: 7px 0;
  padding: 13px;
  cursor: pointer;
  font-size: 15px;
}
.lab-folder:hover,
.lab-folder.selected {
  border-color: #67e8f9;
  background: #123044;
}
.lab-input, .lab-select, .lab-textarea {
  display: block;
  width: 100%;
  padding: 11px;
  margin: 7px 0 14px;
  border: 1px solid #475569;
  border-radius: 7px;
  background: #020617;
  color: white;
  font: inherit;
}
.lab-textarea { min-height: 75px; resize: vertical; }
.lab-button {
  background: #67e8f9;
  color: #020617;
  border: none;
  border-radius: 7px;
  padding: 10px 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px 5px 5px 0;
}
.lab-step {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 17px;
  margin: 5px 0;
}
.lab-step h3 {
  margin: 0 0 12px;
  color: #67e8f9;
}
.lab-arrow {
  text-align: center;
  color: #67e8f9;
  font-size: 25px;
  padding: 6px;
}
.lab-warning {
  border-left: 4px solid #f59e0b;
  background: #422006;
  padding: 12px;
  border-radius: 5px;
  margin: 12px 0;
}
.lab-danger {
  border-left: 4px solid #ef4444;
  background: #450a0a;
  padding: 14px;
  border-radius: 6px;
  margin: 12px 0;
}
.lab-success { color: #86efac; }
.lab-missing { color: #fca5a5; }
.lab-planned { color: #fcd34d; }
.lab-step label {
  display: block;
  margin-top: 9px;
  font-size: 13px;
  color: #cbd5e1;
}
.lab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 12px;
}
.lab-seq {
  word-break: break-all;
  font-family: monospace;
  color: #a5f3fc;
}
@media print {
  .research-nav, #lab-controls, #lab-folders,
  .lab-button { display: none !important; }
  body { background: white !important; }
  #lab-procedures {
    display: block !important;
    color: black;
    background: white;
  }
  .lab-card, .lab-step {
    background: white;
    color: black;
    break-inside: avoid;
  }
  .lab-step h3, .lab-heading { color: black; }
  .lab-arrow { color: black; }
}
</style>

<section id="lab-procedures">
  <div class="lab-wrap">
    <h1 class="lab-heading">🧬 Laboratory Procedure Library</h1>
    <p class="lab-muted">
      Shared procedures organized by organism and
      linked to your existing species and primer records.
    </p>

    <div id="lab-controls" class="lab-card">
      <label for="lab-species-select">Select species</label>
      <select id="lab-species-select" class="lab-select"></select>

      <button class="lab-button" id="lab-open-species">
        Open Species Procedure
      </button>
      <button class="lab-button" id="lab-print">
        Print Procedure
      </button>
      <button class="lab-button" id="lab-export">
        Export SOP Notes
      </button>
    </div>

    <h2 class="lab-heading">Procedure Folders</h2>
    <div id="lab-folders"></div>

    <div id="lab-procedure-detail"></div>
  </div>
</section>

<script>
(() => {
  "use strict";

  /*
   * This module uses GROUPS and PRIMERS from
   * the existing Genome Learning Portfolio.
   *
   * It does not invent laboratory measurements.
   * Exact values can be recorded from a reviewed SOP.
   */

  const FOLDERS = {
    P1: {
      name: "Plant DNA Research",
      description: "Leaves, plant tissue, and plant barcoding",
      groups: ["plant"],
      equipment: [
        "Specimen containers",
        "Microscope",
        "Pipettes",
        "Tubes and racks",

      ]
    },
    P2: {

        "Sequencing access"
      ]
    },
    P3: {
      name: "Vertebrate DNA Research",
      description: "Fish, mammals, birds, and amphibians",
      groups: ["human","animal"],
      equipment: [
        "Authorized specimen material",
        "Specimen containers",
        "Microscope",
        "Pipettes",
        "Tubes and racks",
        "Tissue extraction reagents",
        "Centrifuge",
        "Thermal cycler",
        "Gel electrophoresis system",
        "Sequencing access"
      ]
    },
    P4: {
      name: "Bacterial DNA Research",
      description: "Verified low-risk laboratory strains only",
      groups: ["bacteria"],
      equipment: [
        "Approved source material",
        "Appropriate containment",
        "Pipettes",
        "Tubes",
        "Validated extraction supplies",
        "Thermal cycler",
        "Gel electrophoresis system"
      ]
    },
    P5: {
      name: "Yeast DNA Research",
      description: "Verified low-risk yeast strains",
      groups: ["fungi"],
      equipment: [
        "Approved yeast strain",
        "Pipettes",
        "Tubes",
        "Yeast-compatible extraction supplies",
        "Centrifuge",
        "Thermal cycler",
        "Gel electrophoresis system"
      ]
    },
    P6: {
      name: "Fungi and Mushroom DNA Research",
      description: "Mushrooms and filamentous fungi",
      groups: ["fungi","mold"],
      equipment: [
        "Verified specimen",
        "Microscope",
        "Pipettes",
        "Tubes",
        "Fungal DNA extraction supplies",
        "Centrifuge",
        "Thermal cycler",
        "Gel electrophoresis system",
        "Sequencing access"
      ]
    },
    P7: {
      name: "Amoeba and Protist Research",
      description: "Specimen-specific research",
      groups: ["amoeba"],
      equipment: [
        "Authorized reference material",
        "Microscope",
        "Computer",
        "Reference genome database"
      ]
    },
    P8: {
      name: "Archaeal Research",
      description: "Archaeal genomes and reference sequences",
      groups: ["archaea"],
      equipment: [
        "Computer",
        "Reference genome database",
        "Sequence analysis software"
      ]
    },
    P9: {
      name: "Virus Reference Research",
      description: "Computational sequence research",
      groups: ["virus"],
      equipment: [
        "Computer",
        "Public reference sequences",
        "Sequence analysis software"
      ]
    },
    P10: {
      name: "Parasite Reference Research",
      description: "Computational sequence research",
      groups: ["parasite"],
      equipment: [
        "Computer",
        "Reference genome database",
        "Published literature"
      ]
    },
    P11: {
      name: "Restricted Organism Research",
      description: "Literature and computational analysis only",
      groups: [],
      equipment: [
        "Computer",
        "Public reference sequences",
        "Scientific publications"
      ]
    },
    P12: {
      name: "CRISPR-Cas9 Research",
      description: "Educational and computational research",
      groups: [],
      equipment: [
        "Computer",
        "Reference sequence database",
        "CRISPR literature and analysis tools"
      ]
    }
  };

  const HIGH_RISK = new Set([
    "Mycobacterium tuberculosis",
    "Staphylococcus aureus",
    "Streptococcus pneumoniae",
    "Salmonella enterica",
    "Pseudomonas aeruginosa",
    "Vibrio cholerae",
    "Influenza A virus",
    "Severe acute respiratory syndrome coronavirus 2",
    "Human immunodeficiency virus 1",
    "Measles morbillivirus",
    "Hepatitis B virus",
    "Dengue virus",
    "Candida albicans",
    "Cryptococcus neoformans",
    "Aspergillus fumigatus",
    "Plasmodium falciparum",
    "Trypanosoma brucei",
    "Schistosoma mansoni",
    "Giardia intestinalis",
    "Toxoplasma gondii",
    "Leishmania major",
    "Brugia malayi",
    "Trichinella spiralis",
    "Entamoeba histolytica",
    "Acanthamoeba castellanii"
  ]);

  // These are illustrative inventory statuses.
  // Edit them when exact models and ownership are confirmed.
  const INVENTORY = {
    "Specimen containers": "owned",
    "Microscope": "owned",
    "Pipettes": "owned",
    "Tubes and racks": "owned",
    "Tubes": "owned",
    "Computer": "owned",
    "Centrifuge": "verify",
    "Thermal cycler": "verify",
    "Gel electrophoresis system": "verify",
    "Sequencing access": "planned",
    "Plant-compatible extraction reagents": "verify",
    "Tissue extraction reagents": "verify",
    "Fungal DNA extraction supplies": "verify",
    "Yeast-compatible extraction supplies": "verify",
    "Validated extraction supplies": "verify",
    "Appropriate containment": "verify",
    "Approved source material": "verify",
    "Approved yeast strain": "verify",
    "Authorized specimen material": "verify",
    "Verified specimen": "verify"
  };

  const VERTEBRATES = new Set([
    "Homo sapiens",
    "Mus musculus",
    "Danio rerio",
    "Gallus gallus",
    "Bos taurus",
    "Canis lupus familiaris",
    "Felis catus",
    "Pan troglodytes",
    "Equus caballus",
    "Sus scrofa",
    "Ovis aries",
    "Xenopus tropicalis"
  ]);

  const YEASTS = new Set([
    "Saccharomyces cerevisiae",
    "Schizosaccharomyces pombe"
  ]);

  const SECTIONS = [
    {
      name: "Specimen Collection and Labeling",
      action:
        "Verify specimen identity and source. Assign a unique specimen ID, label the container, and record collection information.",
      fields: [
        ["Specimen amount", "mg, g, or other validated unit"],
        ["Sample type", "Tissue or specimen description"],
        ["Source reference", "Collection or authorization record"]
      ]
    },
    {
      name: "Voucher Photography",
      action:
        "Photograph the relevant specimen features with the microscope. Save photographs under the specimen ID.",
      fields: [
        ["Image filenames", "Voucher image records"],
        ["Microscope model", "Instrument identification"]
      ]
    },
    {
      name: "DNA Extraction",
      action:
        "Use the approved extraction method for this specimen type. Record the exact reagent additions and physical actions from that SOP.",
      fields: [
        ["Extraction protocol", "Title and version"],
        ["Sample quantity", "mg or µL"],
        ["Lysis buffer", "Name, concentration, µL"],
        ["Enzyme", "Name, concentration, µL"],
        ["Incubation", "°C and minutes"],
        ["Mixing", "Method and duration"],
        ["Centrifugation", "×g, minutes, °C"]
      ]
    },
    {
      name: "DNA Purification",
      action:
        "Follow the reviewed purification method and document the relevant wash, recovery, and elution operations.",
      fields: [
        ["Purification method", "Column, beads, or validated method"],
        ["Wash reagents", "Names, concentrations, volumes"],
        ["Wash sequence", "Validated number and order"],
        ["Centrifugation", "×g, minutes"],
        ["Elution buffer", "Name and µL"],
        ["Recovered DNA", "µL and concentration"]
      ]
    },
    {
      name: "DNA Quality Check",
      action:
        "Assess DNA quality using the method specified by the selected SOP. Document the measurement and control results.",
      fields: [
        ["Quality method", "Gel, fluorometer, etc."],
        ["DNA concentration", "ng/µL"],
        ["A260/A280", "Value if measured"],
        ["Gel agarose", "% and g if applicable"],
        ["Running buffer", "Type and mL"],
        ["DNA ladder", "Name and fragment range"],
        ["Sample loading", "µL"],
        ["Run settings", "V and minutes"],
        ["Observed result", "Quality observations"]
      ]
    },
    {
      name: "PCR Reaction Preparation",
      action:
        "Record the selected PCR assay, primer identifiers, reagent quantities, controls, and full reaction mixture from a validated method.",
      fields: [
        ["PCR protocol", "Source and version"],
        ["DNA template", "ng/µL and µL"],
        ["Master mix", "Product and µL"],
        ["Forward primer", "Stock concentration and µL"],
        ["Reverse primer", "Stock concentration and µL"],
        ["Water", "µL"],
        ["Total volume", "µL"],
        ["Controls", "Positive and negative controls"]
      ]
    },
    {
      name: "PCR Thermal Cycling",
      action:
        "Document the approved thermal cycler program associated with the exact reaction chemistry and target.",
      fields: [
        ["Thermal cycler", "Manufacturer and model"],
        ["Initial denaturation", "°C and seconds"],
        ["Denaturation", "°C and seconds"],
        ["Annealing", "°C and seconds"],
        ["Extension", "°C and seconds"],
        ["Cycle count", "Number"],
        ["Final extension", "°C and minutes"]
      ]
    },
    {
      name: "PCR Gel Electrophoresis",
      action:
        "Record the approved gel preparation, sample loading, electrophoresis settings, controls, and gel image.",
      fields: [
        ["Expected product", "bp"],
        ["Agarose concentration", "%"],
        ["Agarose mass", "g"],
        ["Running buffer", "Type and mL"],
        ["DNA stain", "Product"],
        ["DNA ladder", "Name and µL"],
        ["PCR sample", "µL"],
        ["Loading dye", "µL"],
        ["Voltage", "V"],
        ["Run duration", "Minutes"],
        ["Image filename", "Gel image"]
      ]
    },
    {
      name: "Results and Quality Control",
      action:
        "Compare observed results with the reviewed protocol's acceptance criteria. Check controls before interpreting a specimen result.",
      fields: [
        ["Expected band", "bp"],
        ["Observed band", "bp"],
        ["Positive control", "Result"],
        ["Negative control", "Result"],
        ["Interpretation", "Pass, fail, or inconclusive"],
        ["Next action", "Continue, review, or repeat"]
      ]
    },
    {
      name: "DNA Sequencing",
      action:
        "Use an appropriate sequencing service or compatible instrument. Record the sequence files, quality information, and reference comparisons.",
      fields: [
        ["Sequencing method", "Sanger, nanopore, etc."],
        ["Instrument or service", "Name"],
        ["Input requirement", "Verified quantity and purity"],
        ["Library preparation", "Method or kit"],
        ["Output files", "FASTA, FASTQ, BAM, etc."],
        ["Reference accession", "Accession and version"],
        ["Sequence result", "Identification or alignment notes"]
      ]
    },
    {
      name: "Storage, Repeat, or Disposal",
      action:
        "Determine the appropriate action using the validated material-specific storage, retention, contamination, and disposal requirements.",
      fields: [
        ["Decision", "Store, repeat, review, dispose"],
        ["Storage temperature", "°C"],
        ["Storage container", "Container and label"],
        ["Storage location", "Inventory reference"],
        ["Disposal SOP", "Document reference"],
        ["Repeat reason", "If applicable"]
      ]
    },
    {
      name: "Research Notebook Documentation",
      action:
        "Document experiment results and link the original handwritten notebook pages to the specimen record.",
      fields: [
        ["Experiment ID", "Unique ID"],
        ["Notebook", "Notebook identifier"],
        ["Page numbers", "Page range"],
        ["Protocol source", "Citation and version"],
        ["Reviewer", "Name or role"],
        ["Review status", "Pending, reviewed, approved"]
      ]
    }
  ];

  const REF_STEPS = [
    "Open an authoritative public reference genome or sequence record.",
    "Record the scientific name, accession number, and database source.",
    "Review published gene annotations and relevant research.",
    "Compare public sequences using appropriate computational tools.",
    "Document findings and limitations in the paper notebook."
  ];

  let activeSpecies = "Danio rerio";
  let activeFolder = "P3";

  function allRecords() {
    if (typeof GROUPS === "undefined") return [];
    return GROUPS.flatMap(group =>
      group.examples.map(name => ({
        name,
        group: group.id
      }))
    );
  }

  function speciesGroup(name) {
    const match = allRecords().find(r => r.name === name);
    return match ? match.group : null;
  }

  function folderFor(name) {
    const group = speciesGroup(name);

    if (HIGH_RISK.has(name)) return "P11";
    if (group === "virus") return "P9";
    if (group === "parasite") return "P10";
    if (group === "archaea") return "P8";
    if (group === "amoeba") return "P7";
    if (group === "plant") return "P1";
    if (YEASTS.has(name)) return "P5";
    if (group === "fungi" || group === "mold") return "P6";
    if (group === "bacteria") return "P4";
    if (VERTEBRATES.has(name)) return "P3";
    if (group === "animal") return "P2";

    return "P11";
  }

  function researchOnly(name, folderId) {
    return (
      HIGH_RISK.has(name) ||
      ["P7","P8","P9","P10","P11","P12"].includes(folderId)
    );
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[ch]));
  }

  function noteKey(species, index, label) {
    return "lab-sop:" + species + ":" + index + ":" + label;
  }

  function readNote(key) {
    try { return localStorage.getItem(key) || ""; }
    catch { return ""; }
  }

  function saveNote(key, value) {
    try { localStorage.setItem(key, value); }
    catch { alert("Browser storage is unavailable."); }
  }

  function equipmentStatus(name) {
    const status = INVENTORY[name] || "verify";
    if (status === "owned") {
      return '<span class="lab-success">✔ Owned</span>';
    }
    if (status === "planned") {
      return '<span class="lab-planned">◷ Planned</span>';
    }
    return '<span class="lab-missing">? Verify</span>';
  }

  function renderFolders() {
    const box = document.getElementById("lab-folders");

    box.innerHTML = Object.entries(FOLDERS).map(([id, f]) => `
      <button type="button"
        class="lab-folder ${id === activeFolder ? "selected" : ""}"
        data-lab-folder="${id}">
        📁 <strong>${id} — ${escapeHTML(f.name)}</strong>
        <br>
        <small class="lab-muted">${escapeHTML(f.description)}</small>
      </button>
    `).join("");

    box.querySelectorAll("[data-lab-folder]").forEach(button => {
      button.addEventListener("click", () => {
        activeFolder = button.dataset.labFolder;

        const compatible = allRecords().filter(
          r => folderFor(r.name) === activeFolder
        );

        if (compatible.length) {
          activeSpecies = compatible[0].name;
          document.getElementById("lab-species-select").value =
            activeSpecies;
        }

        renderFolders();
        renderProcedure();
      });
    });
  }

  function renderPrimer(species) {
    if (typeof PRIMERS === "undefined" || !PRIMERS[species]) {
      return `
        <p class="lab-warning">
          No primer pair is stored for this species.
          Verify a published assay before ordering.
        </p>
      `;
    }

    const p = PRIMERS[species];

    return `
      <p><b>Primer identifier:</b> ${escapeHTML(p.id)}</p>
      <p><b>Target:</b> ${escapeHTML(p.target)}</p>
      <p><b>Forward (5′→3′):</b><br>
        <span class="lab-seq">${escapeHTML(p.fwd)}</span></p>
      <p><b>Reverse (5′→3′):</b><br>
        <span class="lab-seq">${escapeHTML(p.rev)}</span></p>
      <p class="lab-muted">
        Published broad-range candidate.
        Species-level compatibility and assay conditions
        require verification.
      </p>
    `;
  }

  function renderEquipment(folder) {
    return `
      <div class="lab-card">
        <h3>🧰 Required Equipment</h3>
        <div class="lab-grid">
          ${folder.equipment.map(name => `
            <div>
              ${escapeHTML(name)}:
              ${equipmentStatus(name)}
            </div>
          `).join("")}
        </div>
        <p class="lab-muted">
          These statuses are an initial inventory, not a
          certification of equipment compatibility.
        </p>
      </div>
    `;
  }

  function renderStep(section, index, species) {
    return `
      <div class="lab-step">
        <h3>Step ${index + 1}: ${escapeHTML(section.name)}</h3>

        <p>${escapeHTML(section.action)}</p>

        <details>
          <summary>Open detailed measurements and SOP notes</summary>

          <p class="lab-warning">
            Enter values only from an applicable
            validated or reviewed procedure.
            Empty fields are not approved settings.
          </p>

          ${section.fields.map(([label, placeholder]) => {
            const key = noteKey(species, index, label);
            return `
              <label>${escapeHTML(label)}</label>
              <input
                class="lab-input lab-sop-field"
                data-note-key="${escapeHTML(key)}"
                value="${escapeHTML(readNote(key))}"
                placeholder="${escapeHTML(placeholder)}"
              >
            `;
          }).join("")}

          <label>Exact physical instructions from reviewed SOP</label>
          <textarea
            class="lab-textarea lab-sop-field"
            data-note-key="${escapeHTML(
              noteKey(species,index,"instructions")
            )}"
            placeholder="Enter the verified step-by-step actions and protocol citation."
          >${escapeHTML(readNote(
            noteKey(species,index,"instructions")
          ))}</textarea>
        </details>
      </div>
    `;
  }

  function renderResearchOnly(species, folderId) {
    return `
      <div class="lab-danger">
        <strong>Research-only procedure</strong>
        <p>
          Do not assume this organism can be collected, cultured,
          amplified, or processed in an ordinary home laboratory.
          This page provides public-reference research steps only.
        </p>
      </div>

      ${REF_STEPS.map((step,index) => `
        ${index ? '<div class="lab-arrow">↓</div>' : ""}
        <div class="lab-step">
          <h3>Step ${index + 1}</h3>
          <p>${escapeHTML(step)}</p>
        </div>
      `).join("")}
    `;
  }

  function renderProcedure() {
    const folder = FOLDERS[activeFolder];
    const box = document.getElementById("lab-procedure-detail");

    if (!folder) return;

    const applicable = folderFor(activeSpecies) === activeFolder;
    const restricted = researchOnly(activeSpecies, activeFolder);

    const speciesList = allRecords()
      .filter(r => folderFor(r.name) === activeFolder)
      .map(r => r.name);

    const header = `
      <div class="lab-card">
        <h2 class="lab-heading">
          📂 ${activeFolder} — ${escapeHTML(folder.name)}
        </h2>

        <p><strong>Selected species:</strong>
          <i>${escapeHTML(activeSpecies)}</i>
        </p>

        <p><strong>Procedure match:</strong>
          ${applicable ? "Assigned category" :
            "Folder opened manually; species compatibility not verified"}
        </p>

        <p class="lab-muted">
          Species associated with this folder:
          ${speciesList.length ?
            escapeHTML(speciesList.join(", ")) :
            "Review-only folder"}
        </p>
      </div>
    `;

    if (restricted) {
      box.innerHTML = header +
        renderEquipment(folder) +
        renderResearchOnly(activeSpecies,activeFolder);
      return;
    }

    const content = SECTIONS.map((section,index) =>
      renderStep(section,index,activeSpecies) +
      (index < SECTIONS.length - 1 ?
        '<div class="lab-arrow">↓</div>' : "")
    ).join("");

    box.innerHTML = `
      ${header}

      <div class="lab-warning">
        The procedure family is a research organizer.
        It is not a validated species-specific SOP.
        A qualified review is required before laboratory use.
      </div>

      ${renderEquipment(folder)}

      <div class="lab-card">
        <h3>🧬 Associated Primer Record</h3>
        ${renderPrimer(activeSpecies)}
      </div>

      <div class="lab-card">
        <h3>📋 Numbered Laboratory Procedure</h3>
        <p class="lab-muted">
          Expand each action to enter verified numerical values,
          physical instructions, and SOP references.
        </p>
      </div>

      ${content}

      <div class="lab-card">
        <h3>Result Decision</h3>
        <p><strong>PASS →</strong> Document controls and
          continue only if acceptance criteria are satisfied.</p>
        <p><strong>FAIL →</strong> Investigate the cause
          before considering a repeat.</p>
        <p><strong>STORE →</strong> Use verified storage conditions.</p>
        <p><strong>DISPOSE →</strong> Follow the applicable
          material-specific disposal procedure.</p>
      </div>
    `;

    box.querySelectorAll(".lab-sop-field").forEach(input => {
      input.addEventListener("change", () => {
        saveNote(input.dataset.noteKey, input.value);
      });
    });
  }

  function openLab() {
    document.getElementById("portfolio").style.display = "none";
    document.getElementById("dash").classList.remove("on");
    document.getElementById("lab-procedures").style.display = "block";

    document.querySelectorAll(".research-nav button")
      .forEach(button => button.classList.remove("active"));

    document.getElementById("lab-nav-button")
      .classList.add("active");

    renderFolders();
    renderProcedure();
    window.scrollTo(0,0);
  }

  function exportNotes() {
    const records = {};
    try {
      for (let i=0;i<localStorage.length;i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("lab-sop:")) {
          records[key] = localStorage.getItem(key);
        }
      }
    } catch {
      alert("Unable to access browser storage.");
      return;
    }

    const blob = new Blob(
      [JSON.stringify(records,null,2)],
      {type:"application/json"}
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "laboratory-sop-notes.json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function initLab() {
    const nav = document.querySelector(".research-nav");

    const button = document.createElement("button");
    button.id = "lab-nav-button";
    button.type = "button";
    button.textContent = "🧪 Lab Procedures";
    nav.appendChild(button);

    button.addEventListener("click", openLab);

    // Hide laboratory panel when existing navigation is used.
    nav.querySelectorAll("button:not(#lab-nav-button)")
      .forEach(existing => {
        existing.addEventListener("click", () => {
          document.getElementById("lab-procedures")
            .style.display = "none";
        });
      });

    const select = document.getElementById("lab-species-select");
    allRecords().forEach(record => {
      const option = document.createElement("option");
      option.value = record.name;
      option.textContent = record.name;
      select.appendChild(option);
    });

    select.value = activeSpecies;

    select.addEventListener("change", () => {
      activeSpecies = select.value;
      activeFolder = folderFor(activeSpecies);
      renderFolders();
      renderProcedure();
    });

    document.getElementById("lab-open-species")
      .addEventListener("click", () => {
        activeSpecies = select.value;
        activeFolder = folderFor(activeSpecies);
        renderFolders();
        renderProcedure();
      });

    document.getElementById("lab-print")
      .addEventListener("click", () => window.print());

    document.getElementById("lab-export")
      .addEventListener("click", exportNotes);

    renderFolders();
    renderProcedure();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded",initLab);
  } else {
    initLab();
  }
})();
</script>
<!-- END LABORATORY PROCEDURE LIBRARY -->
